plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'tv.boughazi.admin'
    compileSdk 34

    defaultConfig {
        applicationId "tv.boughazi.admin"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        debug {
            // Igual que en Boughazi Móvil: con esta firma fija guardada en
            // el propio proyecto, todas las compilaciones futuras firman
            // igual, y las actualizaciones se instalan de verdad encima
            // de la versión anterior, en vez de que Android las rechace.
            storeFile file("ci-debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
