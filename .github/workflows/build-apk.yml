name: Compilar APK de Boughazi Admin

on:
  push:
    branches: [ main ]
  # En los Pull Requests solo se comprueba que compila; no se publica nada.
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Indicar a Gradle dónde está el SDK de Android
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar el APK (debug, listo para instalar directamente)
        run: gradle assembleDebug --stacktrace

      - name: Subir el APK como resultado descargable (copia de seguridad)
        uses: actions/upload-artifact@v4
        with:
          name: boughazi-admin-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar el APK en un enlace permanente (para el móvil)
        if: github.event_name != 'pull_request'
        uses: ncipollo/release-action@v1
        with:
          tag: ultima-version
          name: "Boughazi Admin — última versión"
          body: "Descarga el archivo APK de aquí abajo (en 'Assets') e instálalo directamente en tu móvil Android."
          allowUpdates: true
          replacesArtifacts: true
          artifacts: app/build/outputs/apk/debug/app-debug.apk
          token: ${{ secrets.GITHUB_TOKEN }}
